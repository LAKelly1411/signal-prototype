name: Pipeline

on:
  workflow_dispatch:  # fired by the n8n schedule instead of GitHub's own cron
    inputs:
      sector:
        description: "Run just this sector (slug); empty runs every sector"
        required: false
        default: ""

# Runs commit to the repo; queue them rather than letting two race.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Not a secret — a repo variable, so the model in use is visible
          # without opening the settings page. Falls back to the old secret so
          # the migration doesn't need the variable to exist first; an
          # undefined variable would otherwise arrive as an empty string.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          SECTOR: ${{ inputs.sector }}
        run: |
          if [ -n "$SECTOR" ]; then python -m src.pipeline --sector "$SECTOR"; else python -m src.pipeline; fi

      - name: Commit updated signals
        env:
          SECTOR: ${{ inputs.sector }}
        run: |
          git config user.name "signal-pipeline-bot"
          git config user.email "actions@github.com"
          # Covers data/<slug>/ (signals, run status, archive), data/sectors.json
          # and the gambling compat copy; data/*.db stays gitignored.
          git add data
          git diff --staged --quiet || git commit -m "Update signals${SECTOR:+ ($SECTOR)} [skip ci]"
          git push

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL secret set — skipping notification."
            exit 0
          fi
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"Sector Signal pipeline failed: $RUN_URL\"}" \
            "$WEBHOOK_URL"
